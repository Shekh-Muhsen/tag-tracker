plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def ks = System.getenv("ANDROID_KEYSTORE_PATH")
def repoRoot = file("../..")
def versionFile = new File(repoRoot, "VERSION")
if (!versionFile.isFile()) throw new GradleException("Missing VERSION at repository root")
def appVersion = versionFile.text.trim()
if (!(appVersion ==~ /[0-9]+\\.[0-9]+(\\.[0-9]+)?/)) {
    throw new GradleException("VERSION must be MAJOR.MINOR or MAJOR.MINOR.PATCH")
}
def versionParts = appVersion.tokenize(".").collect { it.toInteger() }
def major = versionParts[0]
def minor = versionParts[1]
def patch = versionParts.size() > 2 ? versionParts[2] : 0
if (minor >= 100 || patch >= 100 || major > 200000) {
    throw new GradleException("VERSION components exceed the supported versionCode range")
}
def appVersionCode = major * 10000 + minor * 100 + patch
def gfmtDir = new File(repoRoot, "vendor/GoogleFindMyTools")
def genPy = layout.buildDirectory.dir("sharedCode/serverpy").get().asFile
def genWeb = layout.buildDirectory.dir("sharedCode/webassets").get().asFile
// Must exist at configuration time because Chaquopy / assets register them as source dirs.
genPy.mkdirs()
genWeb.mkdirs()

android {
    namespace "com.tagtracker.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.tagtracker.app"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
        ndk { abiFilters "arm64-v8a" }  // real phones only; drops x86_64 emulator libs (~half the size)
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storeType "pkcs12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true       // R8: shrink + obfuscate the APK
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without a keystore secret the release build falls back to the debug key.
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main { assets.srcDirs += genWeb }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip { install "-r", "requirements-android.txt" }
        extractPackages "certifi"
    }
    sourceSets {
        main {
            srcDir "src/main/python"
            srcDir genPy
            srcDir gfmtDir
        }
    }
}

// Share the server's Python code and the web UI with the app instead of duplicating them.
tasks.register("copySharedCode", Copy) {
    from(new File(repoRoot, "server")) { include "*.py"; into "serverpy/server" }
    from(new File(repoRoot, "web")) { into "webassets/web" }
    into layout.buildDirectory.dir("sharedCode")
    doFirst {
        if (!new File(gfmtDir, "NovaApi").exists()) {
            throw new GradleException("Missing ${gfmtDir}. Run setup.ps1 / setup.sh (or clone GoogleFindMyTools there) first.")
        }
    }
}
preBuild.dependsOn "copySharedCode"
// The Python source-merge / proxy tasks and asset merge read the generated dirs, so make
// them wait for the copy (avoids Gradle's implicit-dependency error).
tasks.matching {
    it.name ==~ /(?i)(merge|generate).*Python.*|merge.*Assets/
}.configureEach { dependsOn "copySharedCode" }

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "androidx.webkit:webkit:1.12.1"
}
