name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", "server/**", "VERSION", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GoogleFindMyTools (bundled into the APK)
        run: |
          git clone https://github.com/leonboe1/GoogleFindMyTools vendor/GoogleFindMyTools
          git -C vendor/GoogleFindMyTools checkout d46e9528578015b51d3b84dd91bf8f16e9ab850f
          # Apply our FCM/location reliability fixes on top of the pinned commit.
          for p in vendor-patches/*.patch; do
            echo "Applying $p"
            git -C vendor/GoogleFindMyTools apply "$GITHUB_WORKSPACE/$p"
          done
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Read application version
        id: app_version
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::VERSION must be MAJOR.MINOR or MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must match VERSION (v$version)"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Prevent publishing a debug-signed release: Android updates require a stable key.
      - name: Require permanent signing for official releases
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ -z "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_* secrets before tagging a release."
            exit 1
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "TagTracker-v${{ steps.app_version.outputs.name }}.apk"
          # One transitional legacy alias for clients that still download TagTracker.apk.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            cp "TagTracker-v${{ steps.app_version.outputs.name }}.apk" TagTracker.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TagTracker-v${{ steps.app_version.outputs.name }}-apk
          path: android/TagTracker-v${{ steps.app_version.outputs.name }}.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/TagTracker-v${{ steps.app_version.outputs.name }}.apk
            android/TagTracker.apk
